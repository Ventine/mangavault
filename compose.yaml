services:
  mongodb:
    image: 'mongo:latest'
    container_name: mangavault-db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=mangavault
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

  mangavault-api:
    build: .
    container_name: mangavault-app
    ports:
      - '8080:8080'
    environment:
      # IMPORTANTE: Usamos 'mongodb' como host, NO 'localhost'
      - SPRING_DATA_MONGODB_URI=mongodb://admin:password@mongodb:27017/mangavault?authSource=admin
      # Si tienes la propiedad de Jikan en application.properties, se usará esa, 
      # pero también puedes sobreescribirla aquí:
      - APP_EXTERNAL_API_JIKAN_BASE_URL=https://api.jikan.moe/v4
    depends_on:
      - mongodb
    restart: on-failure

  mongo-express:
    image: mongo-express
    container_name: mangavault-gui
    ports:
      - '8081:8081'
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password
      - "ME_CONFIG_MONGODB_URL=mongodb://admin:password@mongodb:27017/"
    depends_on:
      - mongodb

volumes:
  mongodb_data: