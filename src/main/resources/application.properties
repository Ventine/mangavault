# ===================================================================
# 1. INFORMACIÓN DE LA APLICACIÓN
# ===================================================================
spring.application.name=mangavault-api
# Perfil por defecto. Puedes inyectar 'prod' o 'test' desde variables de entorno
spring.profiles.active=${APP_PROFILE:dev}

# ===================================================================
# 2. CONFIGURACIÓN DEL SERVIDOR WEB
# ===================================================================
server.port=8080
# [SENIOR MOVE] Habilitar compresión GZIP para ahorrar ancho de banda y latencia
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# ===================================================================
# 3. BASE DE DATOS (MongoDB)
# ===================================================================
# La Magia: Intenta tomar la URI del Docker Compose. Si no existe (IDE local), usa localhost por defecto.
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://admin:password@localhost:27017/mangavault?authSource=admin}

# ===================================================================
# 4. APIs EXTERNAS (Jikan)
# ===================================================================
app.external-api.jikan.base-url=${APP_EXTERNAL_API_JIKAN_BASE_URL:https://api.jikan.moe/v4}

# ===================================================================
# 5. SERIALIZACIÓN JSON (Jackson)
# ===================================================================
# Evita que la app explote si Jikan añade nuevos campos en el futuro
spring.jackson.deserialization.fail-on-unknown-properties=false
# Mantén el JSON limpio: No envíes campos al frontend si su valor es null
spring.jackson.default-property-inclusion=non_null

# ===================================================================
# 6. OBSERVABILIDAD & ACTUATOR
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,liveness,readiness
management.endpoint.health.show-details=always
# Habilitar "Probes" (sondas) para el Healthcheck que configuramos en Docker
management.endpoint.health.probes.enabled=true

# ===================================================================
# 7. LOGGING
# ===================================================================
logging.pattern.level=%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]

# Usamos variables con valores por defecto para poder "apagar" el ruido en producción
logging.level.com.mangavault=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:DEBUG}
# Ocultar el ruido excesivo de Spring Boot al arrancar
logging.level.org.springframework.web=INFO
logging.level.org.mongodb.driver=WARN

# ===================================================================
# 8. DEVTOOLS (Solo actúa en IDE)
# ===================================================================
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.restart.exclude=static/**,public/**