# ===================================================================
# 1. INFORMACIÓN DE LA APLICACIÓN
# ===================================================================
spring.application.name=mangavault-api
spring.profiles.active=${APP_PROFILE:dev}

# ===================================================================
# 2. CONFIGURACIÓN DEL SERVIDOR WEB
# ===================================================================
server.port=8080
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# [DEBUG MOVE] Mostrar detalles de errores en la respuesta HTTP para desarrollo
server.error.include-message=always
server.error.include-stacktrace=always

# ===================================================================
# 3. BASE DE DATOS (MongoDB)
# ===================================================================
# REFACTOR: El fallback ahora apunta a 'mongodb' (nombre del servicio en Docker).
# Si programas en VS Code fuera de Docker, usa la variable de entorno para localhost.
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://admin:password@db:27017/mangavault?authSource=admin}

# ===================================================================
# 4. APIs EXTERNAS (Jikan)
# ===================================================================
app.external-api.jikan.base-url=${APP_EXTERNAL_API_JIKAN_BASE_URL:https://api.jikan.moe/v4}

# ===================================================================
# 5. SERIALIZACIÓN JSON (Jackson)
# ===================================================================
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# ===================================================================
# 6. OBSERVABILIDAD & ACTUATOR
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,liveness,readiness
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# ===================================================================
# 7. LOGGING (Máxima Visibilidad)
# ===================================================================
logging.pattern.level=%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]

# Nivel raíz
logging.level.root=INFO

# Tu código (Ajustado a TRACE para ver todo el flujo de saveToVault)
logging.level.com.mangavault=${LOG_LEVEL_APP:TRACE}

# Seguridad: Ver por qué permite o bloquea peticiones
logging.level.org.springframework.security=DEBUG

# Web: Ver qué llega al controlador y qué responde
logging.level.org.springframework.web=DEBUG

# MongoDB: Ver las consultas reales (JSON) que se envían a la DB
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.mongodb.driver.protocol.command=DEBUG

# Jikan/RestClient: Ver las peticiones salientes
logging.level.org.springframework.web.client.RestClient=DEBUG

# ===================================================================
# 8. DEVTOOLS
# ===================================================================
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.restart.exclude=static/**,public/**